<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video tracking – Kinematics and energy</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f3f3f5;--ac:#c2410c;--bd:#d9d9de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececf0;--mut:#9a9aa3;--card:#232328;--ac:#fb923c;--bd:#38383f}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececf0;--mut:#9a9aa3;--card:#232328;--ac:#fb923c;--bd:#38383f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 8px}
p.s{color:var(--mut);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
button,select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:7px;padding:6px 10px}
input[type=number]{width:84px}input[type=range]{flex:1;min-width:160px;padding:0}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
canvas{max-width:100%;height:auto;border-radius:6px;background:#000;display:block;cursor:crosshair}
.ch{background:var(--bg);cursor:default;border:1px solid var(--bd);width:100%;height:auto}
.msg{color:var(--ac);font-weight:600;min-height:1.4em}
.sc{overflow-x:auto;max-height:340px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:3px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{position:sticky;top:0;background:var(--card)}
pre{margin:0;white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace}
.g,.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.g,.g2{grid-template-columns:1fr}}
label{color:var(--mut);font-size:13px}
</style></head><body><main>
<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h1 style="margin:0">Video tracking: kinematics, energy, equations of motion</h1><div class="row" style="margin:0;flex-wrap:nowrap"><button id="lEN">EN</button><button id="lFR">FR</button></div></div>
<p class="s">Load a video → set the scale → place the origin → track the object frame by frame.</p>

<div class="card">
 <div class="row"><button id="up">📁 Import a video</button><button id="cam">🎥 Record</button><input type="file" id="f" accept="video/*" hidden><input type="file" id="fc" accept="video/*" capture="environment" hidden>
  <label>Video frames/s <input type="number" id="fps" value="30" min="1" step="any"></label>
  <label>Step (frames) <input type="number" id="step" value="1" min="1" step="1"></label>
  <label>Mass (kg) <input type="number" id="m" value="1" min="0" step="any"></label>
  <label>g (m/s²) <input type="number" id="g" value="9.81" step="any"></label></div>
 <div class="row">
  <button id="b1">1. Scale</button><button id="b2">2. Origin</button><button id="b3">3. Manual tracking</button><button id="b4">4. Auto tracking</button><button id="stop">Stop</button>
  <button id="undo">Undo last point</button><button id="clr">Clear all</button>
  <label>Real distance (m) <input type="number" id="dist" value="1" min="0" step="any"></label></div>
 <div class="row"><label>Method <select id="meth"><option value="col">Color (recommended)</option><option value="tpl">Shape (template)</option></select></label><label>Color tolerance <input type="number" id="tol" value="60" min="10" max="250"></label><label>Template half-size (px, shape mode) <input type="number" id="tsz" value="10" min="3"></label><label>Search radius (px) <input type="number" id="rad" value="40" min="5"></label><label>Confidence threshold <input type="number" id="thr" value="0.5" min="0" max="1" step="0.05"></label><label><input type="checkbox" id="upd" checked> Adapt template (if confidence &gt; 0.9)</label></div>
 <div class="msg" id="msg">Load a video.</div>
 <div class="row"><button id="prev">◀</button><input type="range" id="sl" min="0" max="1" step="0.001" value="0"><button id="next">▶</button><span id="tl"></span></div>
 <video id="v" muted playsinline preload="auto" style="position:absolute;width:2px;height:2px;opacity:0;pointer-events:none"></video>
 <canvas id="c" width="640" height="360"></canvas>
</div>

<div class="g">
 <div class="card"><h2>Equations of motion (t = 0 at first point)</h2>
  <div class="row"><label>Degree x(t) <select id="dx"><option>1</option><option>2</option></select></label>
  <label>Degree y(t) <select id="dy"><option>1</option><option selected>2</option></select></label></div>
  <pre id="eq">—</pre></div>
 <div class="card"><h2>Final state</h2><pre id="fin">—</pre></div>
</div>

<div class="card"><h2>Graphs</h2><div class="g2"><canvas id="c1" class="ch" width="640" height="300"></canvas><canvas id="c2" class="ch" width="640" height="300"></canvas><canvas id="c3" class="ch" width="640" height="300"></canvas><canvas id="c4" class="ch" width="640" height="300"></canvas></div></div>

<div class="card"><h2>Measurement table</h2>
 <div class="row"><button id="cp">Copy for spreadsheet</button><span id="cpm" class="msg"></span></div>
 <div class="sc"><table id="tb"></table></div></div>
</main>
<script>
let LANG='en';try{LANG=localStorage.getItem('lang')||((navigator.language||'').slice(0,2)==='fr'?'fr':'en');}catch(e){}
const FR={"Video tracking – Kinematics and energy": "Pointage vidéo – Cinématique et énergies", "Video tracking: kinematics, energy, equations of motion": "Pointage vidéo : cinématique, énergies, équations horaires", "Load a video → set the scale → place the origin → track the object frame by frame.": "Charger une vidéo → étalonner l’échelle → placer l’origine → pointer le mobile image par image.", "📁 Import a video": "📁 Importer une vidéo", "🎥 Record": "🎥 Filmer", "Video frames/s": "Images/s de la vidéo", "Step (frames)": "Pas (images)", "Mass (kg)": "Masse (kg)", "1. Scale": "1. Échelle", "2. Origin": "2. Origine", "3. Manual tracking": "3. Pointage manuel", "4. Auto tracking": "4. Pointage auto", "Stop": "Arrêter", "Undo last point": "Annuler dernier point", "Clear all": "Tout effacer", "Real distance (m)": "Distance réelle (m)", "Method": "Méthode", "Color (recommended)": "Couleur (conseillé)", "Shape (template)": "Forme (modèle)", "Color tolerance": "Tolérance couleur", "Template half-size (px, shape mode)": "Demi-taille du modèle (px, mode forme)", "Search radius (px)": "Rayon de recherche (px)", "Confidence threshold": "Seuil de confiance", "Adapt template (if confidence > 0.9)": "Adapter le modèle (si confiance > 0,9)", "Load a video.": "Chargez une vidéo.", "Equations of motion (t = 0 at first point)": "Équations horaires (t = 0 au premier point)", "Degree x(t)": "Degré x(t)", "Degree y(t)": "Degré y(t)", "Final state": "État final", "Graphs": "Courbes", "Measurement table": "Tableau de mesures", "Copy for spreadsheet": "Copier pour tableur", "KE (J)": "Ec (J)", "PE (J)": "Ep (J)", "ME (J)": "Em (J)", "KE": "Ec", "PE": "Ep", "ME": "Em", "Video loaded. Enter the frames/s, then click “1. Scale”.": "Vidéo chargée. Renseignez les images/s, puis cliquez sur « 1. Échelle ».", "Loading video… (": "Chargement de la vidéo… (", " MB)": " Mo)", "Cannot read this video (format not supported, code ": "Impossible de lire cette vidéo (format non supporté, code ", "). On iPhone: Settings > Camera > Formats > Most Compatible, then film again.": "). Sur iPhone : Réglages > Appareil photo > Formats > Le plus compatible, puis refilmez.", "Click the 2 ends of a known length.": "Cliquez sur les 2 extrémités d’une longueur connue.", "Click the origin of the frame (x to the right, y up).": "Cliquez sur l’origine du repère (x vers la droite, y vers le haut).", "Click the object; the video advances automatically.": "Cliquez sur le mobile ; la vidéo avance automatiquement.", "Click the object (first frame): auto tracking then starts.": "Cliquez sur le mobile (image de départ) : le suivi automatique démarre ensuite.", "Scale: ": "Échelle : ", " m/pixel. Now set the origin.": " m/pixel. Passez à l’origine.", "Origin set. Now start tracking.": "Origine placée. Passez au pointage.", "Set the scale and the origin first.": "Faites d’abord l’échelle et l’origine.", " s (frame ": " s (image ", "(ref.: y = 0 at the origin)": "(réf. : y = 0 à l’origine)", "Object color not detected: click at the center of the object or increase the tolerance.": "Couleur du mobile non détectée : cliquez au centre du mobile ou augmentez la tolérance.", "End of video reached.": "Fin de la vidéo atteinte.", "Tracking lost at t = ": "Suivi perdu à t = ", " s (confidence ": " s (confiance ", "). Try the Color method, or shrink the template so it fits the object.": "). Essayez la méthode Couleur, ou réduisez le modèle pour qu’il colle au mobile.", "Object not found at t = ": "Mobile introuvable à t = ", " s. Increase the color tolerance or the radius, and check the frames/s and the step.": " s. Augmentez la tolérance couleur ou le rayon, vérifiez les images/s et le pas.", " px detected": " px détectés", "Tracking… frame ": "Suivi en cours… image ", "confidence ": "confiance ", "Tracking stopped.": "Suivi arrêté.", "Tracking finished.": "Suivi terminé.", "not enough points": "pas assez de points", "No data yet.": "Pas encore de données.", "Copied.": "Copié.", "Copy blocked: select the table by hand.": "Copie bloquée : sélectionnez le tableau à la main.", "position (m)": "position (m)", "speed (m/s)": "vitesse (m/s)", "energy (J)": "énergie (J)", "Positions x(t) and y(t)": "Positions x(t) et y(t)", "Speed v(t) and components vx(t), vy(t)": "Vitesse v(t) et composantes vx(t), vy(t)", "Kinetic, potential and mechanical energy": "Énergies cinétique, potentielle, mécanique", "Trajectory y(x)": "Trajectoire y(x)"};
const tr=s=>LANG==='fr'&&FR[s]!==undefined?FR[s]:s;
function setLang(l){LANG=l;try{localStorage.setItem('lang',l);}catch(e){}applyLang();}
function applyLang(){
 document.documentElement.lang=LANG;document.title=tr('Video tracking – Kinematics and energy');
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){
  if(n.parentNode.closest('script,canvas,#msg,pre,#tb'))continue;
  const raw=n.nodeValue,k=n.__k||raw.trim();
  if(!k||(!n.__k&&FR[k]===undefined))continue;
  n.__k=k;const m=raw.match(/^(\s*)[\s\S]*?(\s*)$/);n.nodeValue=m[1]+tr(k)+m[2];
 }
 $('lEN').classList.toggle('on',LANG==='en');$('lFR').classList.toggle('on',LANG==='fr');
 if(!v.duration)say(tr('Load a video.'));else say('');
 refresh();
}
const $=id=>document.getElementById(id),v=$('v'),c=$('c'),ctx=c.getContext('2d');
const S={pts:[],cal:[],scale:null,orig:null,mode:null};
const fps=()=>+$('fps').value||30, dt=()=>1/fps();
const say=t=>$('msg').textContent=t;
const fmt=n=>isFinite(n)?String(+n.toPrecision(4)):'—';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

$('up').onclick=()=>{$('f').value='';$('f').click();};$('cam').onclick=()=>{$('fc').value='';$('fc').click();};
['f','fc'].forEach(id=>$(id).onchange=e=>{const f=e.target.files[0];if(!f)return;S.stop=true;S.pts=[];S.cal=[];S.scale=null;S.orig=null;S.mode=null;say(tr('Loading video… (')+Math.round(f.size/1e6)+tr(' MB)'));v.src=URL.createObjectURL(f);v.load();refresh();});
v.onloadedmetadata=()=>{c.width=v.videoWidth;c.height=v.videoHeight;$('sl').max=v.duration;$('tsz').value=Math.round(c.width/64);$('rad').value=Math.round(c.width/12);seek(0);say(tr('Video loaded. Enter the frames/s, then click “1. Scale”.'));};
v.onerror=()=>say(tr('Cannot read this video (format not supported, code ')+(v.error&&v.error.code)+tr('). On iPhone: Settings > Camera > Formats > Most Compatible, then film again.'));
function seek(t){t=Math.max(0,Math.min(v.duration||0,t));return new Promise(r=>{if(Math.abs(v.currentTime-t)<1e-4){draw();r();return;}
 v.onseeked=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{draw();r();}));v.currentTime=t;});}
const frame=()=>Math.round(v.currentTime*fps());
$('sl').oninput=e=>seek(+e.target.value);
$('prev').onclick=()=>seek(v.currentTime-dt());
$('next').onclick=()=>seek(v.currentTime+dt());

function setMode(m){S.mode=m;['b1','b2','b3','b4'].forEach((b,i)=>$(b).classList.toggle('on',m===['cal','orig','track','auto'][i]));
 say({cal:tr('Click the 2 ends of a known length.'),orig:tr('Click the origin of the frame (x to the right, y up).'),track:tr('Click the object; the video advances automatically.'),auto:tr('Click the object (first frame): auto tracking then starts.')}[m]||'');if(m==='cal')S.cal=[];}
$('b1').onclick=()=>setMode('cal');$('b2').onclick=()=>setMode('orig');$('b3').onclick=()=>setMode('track');$('b4').onclick=()=>setMode('auto');$('stop').onclick=()=>{S.stop=true;};
$('undo').onclick=()=>{const p=S.pts.pop();if(p)seek(p.t);refresh();};
$('clr').onclick=()=>{S.stop=true;S.pts=[];S.cal=[];S.scale=null;S.orig=null;setMode(null);draw();refresh();};

c.onclick=async e=>{
 if(!v.duration)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;
 if(S.mode==='cal'){S.cal.push({x,y});if(S.cal.length===2){const d=Math.hypot(S.cal[1].x-S.cal[0].x,S.cal[1].y-S.cal[0].y);
   S.scale=(+$('dist').value)/d;say(tr('Scale: ')+fmt(S.scale)+tr(' m/pixel. Now set the origin.'));S.mode=null;}draw();}
 else if(S.mode==='orig'){S.orig={x,y};say(tr('Origin set. Now start tracking.'));S.mode=null;draw();refresh();}
 else if(S.mode==='auto'){await startAuto(x,y);}
 else if(S.mode==='track'){
  if(!S.scale||!S.orig){say(tr('Set the scale and the origin first.'));return;}
  const k=frame(),i=S.pts.findIndex(p=>p.k===k),p={k,t:k/fps(),px:x,py:y};
  if(i>=0)S.pts[i]=p;else{S.pts.push(p);S.pts.sort((a,b)=>a.k-b.k);}
  refresh();await seek(v.currentTime+(+$('step').value||1)*dt());}
};

function draw(){
 if(!v.videoWidth)return;ctx.drawImage(v,0,0,c.width,c.height);const u=c.width/640;
 ctx.lineWidth=2*u;
 if(S.orig){ctx.strokeStyle='#22c55e';ctx.beginPath();ctx.moveTo(S.orig.x,S.orig.y);ctx.lineTo(S.orig.x+60*u,S.orig.y);ctx.moveTo(S.orig.x,S.orig.y);ctx.lineTo(S.orig.x,S.orig.y-60*u);ctx.stroke();
  ctx.fillStyle='#22c55e';ctx.font=14*u+'px sans-serif';ctx.fillText('x',S.orig.x+64*u,S.orig.y+5*u);ctx.fillText('y',S.orig.x-4*u,S.orig.y-66*u);}
 if(S.cal.length){ctx.strokeStyle='#38bdf8';ctx.fillStyle='#38bdf8';ctx.beginPath();S.cal.forEach((q,i)=>{i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y);});ctx.stroke();S.cal.forEach(q=>{ctx.fillRect(q.x-3*u,q.y-3*u,6*u,6*u);});}
 ctx.fillStyle='#ef4444';S.pts.forEach(p=>{ctx.beginPath();ctx.arc(p.px,p.py,4*u,0,7);ctx.fill();});
 if(S.box){ctx.strokeStyle='#facc15';ctx.strokeRect(S.box.x-S.box.h,S.box.y-S.box.h,2*S.box.h,2*S.box.h);}
 if(S.blob&&S.k){ctx.fillStyle='rgba(34,211,238,.7)';for(let i=0;i<S.blob.length;i+=2)ctx.fillRect(S.blob[i]*S.k-u,S.blob[i+1]*S.k-u,2*u,2*u);}
 $('sl').value=v.currentTime;$('tl').textContent='t = '+fmt(v.currentTime)+tr(' s (frame ')+frame()+')';
}

function compute(){
 const n=S.pts.length;if(!n||!S.scale||!S.orig)return[];
 const m=+$('m').value,g=+$('g').value,t0=S.pts[0].t;
 const R=S.pts.map(p=>({t:p.t-t0,x:(p.px-S.orig.x)*S.scale,y:(S.orig.y-p.py)*S.scale}));
 R.forEach((r,i)=>{const a=R[Math.max(i-1,0)],b=R[Math.min(i+1,n-1)];
  if(n>1){r.vx=(b.x-a.x)/(b.t-a.t);r.vy=(b.y-a.y)/(b.t-a.t);}else{r.vx=r.vy=NaN;}
  r.v=Math.hypot(r.vx,r.vy);r.Ec=.5*m*r.v*r.v;r.Ep=m*g*r.y;r.Em=r.Ec+r.Ep;});
 return R;
}
function polyfit(ts,ys,d){
 const k=d+1;if(ts.length<k)return null;
 const A=Array.from({length:k},()=>Array(k+1).fill(0));
 ts.forEach((t,i)=>{for(let r=0;r<k;r++){for(let q=0;q<k;q++)A[r][q]+=Math.pow(t,r+q);A[r][k]+=ys[i]*Math.pow(t,r);}});
 for(let i=0;i<k;i++){let p=i;for(let r=i+1;r<k;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];
  if(Math.abs(A[i][i])<1e-12)return null;
  for(let r=0;r<k;r++)if(r!==i){const f=A[r][i]/A[i][i];for(let q=i;q<=k;q++)A[r][q]-=f*A[i][q];}}
 return A.map((row,i)=>row[k]/row[i]);
}
function eqStr(nm,co){if(!co)return nm+'(t) : '+tr('not enough points');
 const u=['',' t',' t²'];return nm+'(t) = '+co.map((a,i)=>(i?(a<0?' − ':' + '):(a<0?'−':''))+fmt(Math.abs(a))+(i?'·t'+(i>1?'²':''):'')).join('');}

function refresh(){
 const R=compute();
 $('tb').innerHTML='<tr><th>t (s)</th><th>x (m)</th><th>y (m)</th><th>vx (m/s)</th><th>vy (m/s)</th><th>v (m/s)</th><th>'+tr('KE (J)')+'</th><th>'+tr('PE (J)')+'</th><th>'+tr('ME (J)')+'</th></tr>'+
  R.map(r=>'<tr>'+[r.t,r.x,r.y,r.vx,r.vy,r.v,r.Ec,r.Ep,r.Em].map(a=>'<td>'+fmt(a)+'</td>').join('')+'</tr>').join('');
 if(R.length){const ts=R.map(r=>r.t),cx=polyfit(ts,R.map(r=>r.x),+$('dx').value),cy=polyfit(ts,R.map(r=>r.y),+$('dy').value);
  let s=eqStr('x',cx)+' (m)\n'+eqStr('y',cy)+' (m)';
  if(cx)s+='\nvx(t) = '+fmt(cx[1]||0)+(cx[2]?(cx[2]<0?' − ':' + ')+fmt(2*Math.abs(cx[2]))+'·t':'')+' (m/s)';
  if(cy)s+='\nvy(t) = '+fmt(cy[1]||0)+(cy[2]?(cy[2]<0?' − ':' + ')+fmt(2*Math.abs(cy[2]))+'·t':'')+' (m/s)';
  $('eq').textContent=s;
  const L=R[R.length-1];$('fin').textContent='t = '+fmt(L.t)+' s\nx = '+fmt(L.x)+' m   y = '+fmt(L.y)+' m\nvx = '+fmt(L.vx)+' m/s   vy = '+fmt(L.vy)+' m/s\nv = '+fmt(L.v)+' m/s\n'+tr('KE')+' = '+fmt(L.Ec)+' J\n'+tr('PE')+' = '+fmt(L.Ep)+' J  '+tr('(ref.: y = 0 at the origin)')+'\n'+tr('ME')+' = '+fmt(L.Em)+' J';
 }else{$('eq').textContent='—';$('fin').textContent='—';}
 chart(R);draw();
}
['dx','dy','m','g'].forEach(i=>$(i).onchange=refresh);

function addPt(px,py){const k=frame(),p={k,t:k/fps(),px,py},i=S.pts.findIndex(q=>q.k===k);if(i>=0)S.pts[i]=p;else{S.pts.push(p);S.pts.sort((a,b)=>a.k-b.k);}}
const PC=document.createElement('canvas'),pctx=PC.getContext('2d',{willReadFrequently:true});
function grab(){const k=Math.min(1,640/c.width);PC.width=Math.round(c.width*k);PC.height=Math.round(c.height*k);S.k=c.width/PC.width;
 pctx.drawImage(v,0,0,PC.width,PC.height);const d=pctx.getImageData(0,0,PC.width,PC.height).data,n=PC.width*PC.height,gr=new Float32Array(n);
 S.rgb=d;for(let i=0;i<n;i++)gr[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];return gr;}
function mkTpl(gr,cx,cy,h){const W=PC.width,N=(2*h+1)**2,t=new Float32Array(N);let sum=0,i=0;
 for(let y=-h;y<=h;y++)for(let x=-h;x<=h;x++){const q=gr[(cy+y)*W+cx+x];t[i++]=q;sum+=q;}
 const mean=sum/N;let nn=0;for(let j=0;j<N;j++){t[j]-=mean;nn+=t[j]*t[j];}return{t,h,N,nn:Math.sqrt(nn)||1};}
function match(gr,T,cx,cy,R){const W=PC.width,H=PC.height,h=T.h;let best=-2,bx=cx,by=cy;
 for(let y0=Math.max(h,cy-R);y0<=Math.min(H-h-1,cy+R);y0++)for(let x0=Math.max(h,cx-R);x0<=Math.min(W-h-1,cx+R);x0++){
  let sp=0,spp=0,spt=0,i=0;
  for(let y=-h;y<=h;y++){const o=(y0+y)*W+x0-h;for(let x=0;x<=2*h;x++){const q=gr[o+x];sp+=q;spp+=q*q;spt+=q*T.t[i++];}}
  const vr=spp-sp*sp/T.N;if(vr<1e-6)continue;const r=spt/(Math.sqrt(vr)*T.nn);if(r>best){best=r;bx=x0;by=y0;}}
 return{x:bx,y:by,s:best};}
function medColor(rgb,cx,cy){const W=PC.width,H=PC.height,ch=[[],[],[]];
 for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++){const xx=Math.min(Math.max(cx+x,0),W-1),yy=Math.min(Math.max(cy+y,0),H-1),i=4*(yy*W+xx);for(let q=0;q<3;q++)ch[q].push(rgb[i+q]);}
 return ch.map(a=>{a.sort((p1,p2)=>p1-p2);return a[12];});}
function pickBlob(rgb,col,tol,qx,qy,R,A0){
 const W=PC.width,H=PC.height,t2=tol*tol,x0=Math.max(0,qx-R),x1=Math.min(W-1,qx+R),y0=Math.max(0,qy-R),y1=Math.min(H-1,qy+R),w=x1-x0+1,h=y1-y0+1;
 if(w<1||h<1)return null;
 const m=new Uint8Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=4*((y+y0)*W+x+x0),dr=rgb[i]-col[0],dg=rgb[i+1]-col[1],db=rgb[i+2]-col[2];if(dr*dr+dg*dg+db*db<t2)m[y*w+x]=1;}
 let best=null,bd=1e9;
 for(let s0=0;s0<w*h;s0++){if(m[s0]!==1)continue;const st=[s0];m[s0]=2;let sx=0,sy=0,n=0;
  while(st.length){const p=st.pop(),x=p%w,y=(p-x)/w;sx+=x;sy+=y;n++;
   if(x>0&&m[p-1]===1){m[p-1]=2;st.push(p-1);}if(x<w-1&&m[p+1]===1){m[p+1]=2;st.push(p+1);}
   if(y>0&&m[p-w]===1){m[p-w]=2;st.push(p-w);}if(y<h-1&&m[p+w]===1){m[p+w]=2;st.push(p+w);}}
  if(n<Math.max(3,.2*A0))continue;
  const mx=sx/n+x0,my=sy/n+y0,d=Math.hypot(mx-qx,my-qy);if(d<bd){bd=d;best={x:mx,y:my,n};}}
 if(!best)return null;
 const rb=Math.sqrt(best.n/Math.PI)*2+2;let sx=0,sy=0,n=0;const pts=[];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(m[y*w+x]&&Math.hypot(x+x0-best.x,y+y0-best.y)<rb){sx+=x+x0;sy+=y+y0;n++;if(pts.length<800)pts.push(x+x0,y+y0);}
 return{x:sx/n,y:sy/n,n,pts};
}
async function startAuto(x,y){
 if(!S.scale||!S.orig){say(tr('Set the scale and the origin first.'));return;}
 S.stop=false;S.mode=null;
 const stp=+$('step').value||1,thr=+$('thr').value||.5,meth=$('meth').value,tol=+$('tol').value||60;
 let gr=grab();const k=S.k,h=Math.max(2,Math.round((+$('tsz').value||10)/k)),R=Math.max(3,Math.round((+$('rad').value||40)/k));
 let cx=Math.min(Math.max(Math.round(x/k),h),PC.width-h-1),cy=Math.min(Math.max(Math.round(y/k),h),PC.height-h-1);
 let T=null,col=null,A0=0,bh=h*k,n=0,vx=0,vy=0,end=tr('Tracking finished.');
 if(meth==='tpl')T=mkTpl(gr,cx,cy,h);
 else{col=medColor(S.rgb,cx,cy);const b=pickBlob(S.rgb,col,tol,cx,cy,R,0);
  if(!b){setMode(null);say(tr('Object color not detected: click at the center of the object or increase the tolerance.'));return;}
  cx=b.x;cy=b.y;A0=b.n;S.blob=b.pts;bh=(Math.sqrt(b.n/Math.PI)+4)*k;}
 addPt(cx*k,cy*k);S.box={x:cx*k,y:cy*k,h:bh};
 while(!S.stop){
  const nt=v.currentTime+stp*dt();if(nt>v.duration-1e-3){end=tr('End of video reached.');break;}
  await seek(nt);gr=grab();
  const qx=Math.round(cx+vx),qy=Math.round(cy+vy);let info='';
  if(meth==='tpl'){
   let r=match(gr,T,qx,qy,R);if(r.s<thr)r=match(gr,T,qx,qy,3*R);
   if(r.s<thr){end=tr('Tracking lost at t = ')+fmt(v.currentTime)+tr(' s (confidence ')+fmt(r.s)+tr('). Try the Color method, or shrink the template so it fits the object.');break;}
   vx=r.x-cx;vy=r.y-cy;cx=r.x;cy=r.y;info=tr('confidence ')+fmt(r.s);
   if($('upd').checked&&r.s>.9)T=mkTpl(gr,cx,cy,h);
  }else{
   let b=pickBlob(S.rgb,col,tol,qx,qy,R,A0);if(!b)b=pickBlob(S.rgb,col,tol,qx,qy,3*R,A0);
   if(!b){end=tr('Object not found at t = ')+fmt(v.currentTime)+tr(' s. Increase the color tolerance or the radius, and check the frames/s and the step.');break;}
   vx=b.x-cx;vy=b.y-cy;cx=b.x;cy=b.y;S.blob=b.pts;bh=(Math.sqrt(b.n/Math.PI)+4)*k;info=b.n+tr(' px detected');
  }
  addPt(cx*k,cy*k);S.box={x:cx*k,y:cy*k,h:bh};
  if(++n%5===0)refresh();draw();say(tr('Tracking… frame ')+frame()+' ('+info+')');
  await new Promise(ok=>setTimeout(ok));
 }
 if(S.stop)end=tr('Tracking stopped.');S.box=null;S.blob=null;setMode(null);say(end);refresh();
}

function plot(id,series,xl,yl,title){
 const cv=$(id),x=cv.getContext('2d'),W=cv.width,H=cv.height;x.clearRect(0,0,W,H);
 const fg=css('--fg')||'#888',mut=css('--mut')||'#888';
 x.fillStyle=fg;x.font='bold 13px sans-serif';x.fillText(tr(title),10,16);
 const all=series.flatMap(s=>s.Y).filter(isFinite),allx=series[0].X;
 if(!all.length){x.fillStyle=mut;x.font='13px sans-serif';x.fillText(tr('No data yet.'),20,50);return;}
 let a=Math.min(...allx),b=Math.max(...allx),c0=Math.min(...all),c1=Math.max(...all);
 if(a===b){a-=1;b+=1;}if(c0===c1){c0-=1;c1+=1;}const pd=(c1-c0)*.08;c0-=pd;c1+=pd;
 const L=56,T=30,Rr=W-14,B=H-34,X=t=>L+(t-a)/(b-a)*(Rr-L),Y=q=>B-(q-c0)/(c1-c0)*(B-T);
 x.strokeStyle=mut;x.fillStyle=mut;x.font='11px sans-serif';x.lineWidth=1;
 x.beginPath();x.moveTo(L,T);x.lineTo(L,B);x.lineTo(Rr,B);x.stroke();
 for(let i=0;i<=5;i++){const tx=a+(b-a)*i/5,ty=c0+(c1-c0)*i/5;x.fillText(fmt(tx),X(tx)-10,B+14);x.fillText(fmt(ty),2,Y(ty)+4);
  x.globalAlpha=.2;x.beginPath();x.moveTo(L,Y(ty));x.lineTo(Rr,Y(ty));x.stroke();x.globalAlpha=1;}
 x.fillStyle=fg;x.fillText(xl,Rr-70,H-4);x.fillText(tr(yl),L+6,T-4);
 series.forEach((s,j)=>{x.strokeStyle=s.col;x.fillStyle=s.col;x.lineWidth=2;x.beginPath();let pen=false;
  s.X.forEach((t,i)=>{const q=s.Y[i];if(!isFinite(q)){pen=false;return;}pen?x.lineTo(X(t),Y(q)):x.moveTo(X(t),Y(q));pen=true;});x.stroke();
  s.X.forEach((t,i)=>{if(isFinite(s.Y[i])){x.beginPath();x.arc(X(t),Y(s.Y[i]),2.5,0,7);x.fill();}});
  if(series.length>1)x.fillText(tr(s.n),Rr-40,T+14+j*14);});
}
function chart(R){
 const t=R.map(r=>r.t),f=k=>R.map(r=>r[k]);
 plot('c1',[{n:'x',col:'#f97316',X:t,Y:f('x')},{n:'y',col:'#3b82f6',X:t,Y:f('y')}],'t (s)','position (m)','Positions x(t) and y(t)');
 plot('c2',[{n:'v',col:'#ef4444',X:t,Y:f('v')},{n:'vx',col:'#f97316',X:t,Y:f('vx')},{n:'vy',col:'#3b82f6',X:t,Y:f('vy')}],'t (s)','speed (m/s)','Speed v(t) and components vx(t), vy(t)');
 plot('c3',[{n:'KE',col:'#ef4444',X:t,Y:f('Ec')},{n:'PE',col:'#3b82f6',X:t,Y:f('Ep')},{n:'ME',col:'#22c55e',X:t,Y:f('Em')}],'t (s)','energy (J)','Kinetic, potential and mechanical energy');
 plot('c4',[{n:'y(x)',col:'#f97316',X:f('x'),Y:f('y')}],'x (m)','y (m)','Trajectory y(x)');
}
$('cp').onclick=async()=>{const R=compute();const tsv='t\tx\ty\tvx\tvy\tv\t'+tr('KE')+'\t'+tr('PE')+'\t'+tr('ME')+'\n'+R.map(r=>[r.t,r.x,r.y,r.vx,r.vy,r.v,r.Ec,r.Ep,r.Em].join('\t')).join('\n');
 try{await navigator.clipboard.writeText(tsv);$('cpm').textContent=tr('Copied.');}catch(e){$('cpm').textContent=tr('Copy blocked: select the table by hand.');}};
$('lEN').onclick=()=>setLang('en');$('lFR').onclick=()=>setLang('fr');
applyLang();
